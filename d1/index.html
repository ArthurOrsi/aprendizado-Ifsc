
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audi F1 Store</title>

    <link rel="stylesheet" href="my.css">
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="cabe">

        <div class="logo">
            <a href="index.html">
                <h2>AUDI<span> F1</span></h2>
            </a>
        </div>

        <nav>
            <a href="#inicio">Início</a>
            <a href="produtos/index.html">Produtos</a>
            <a href="#sobre">Sobre</a>
        </nav>

        <div class="pesquisa">
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar produtos..."
            >
        </div>

        <div class="conta">
            <a href="#">Minha conta</a>
            <a href="#">🛒 <span id="carrinho">0</span></a>
        </div>

    </header>


    <main>

        <!-- BANNER COM VÍDEO -->

        <section class="banner" id="inicio">

            <video
                class="video-banner"
                autoplay
                muted
                loop
                playsinline
            >
                <source
                    src="https://www.audif1.com/cms/api/media/file/audif1_2026_Q2_team_loop_01.mp4"
                    type="video/mp4"
                >
            </video>

            <div class="video-overlay"></div>

            <div class="banner-texto">

                <p class="subtitulo">
                    AUDI REVOLUT F1 TEAM • 2026
                </p>

                <h1>
                    READY<br>
                    FOR THE FUTURE.
                </h1>

                <p>
                    O espírito das pistas. Agora no seu estilo.
                </p>


</body>

</html>
