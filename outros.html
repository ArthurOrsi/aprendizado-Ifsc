<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá 🖐️</title>
    <style>
        button {
            background: lightgray;
            width: 120px;
            height: 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .btn {
            background: blue;
            color: white;
        }

        #btn-p {
            background: green;
            color: white;
        }

        #btn-d {
            background: red;
            color: white;
        }

        h2 {
            color: crimson;
            font-family: Arial, sans-serif;
            font-size: 2rem;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="topo"></div>
    <h2>🚀 Seja bem-vindo ao painel!</h2>
    </div>

    <main>
        <button>Cancelar</button>
        <button class="btn">Salvar</button>
        <button id="btn-p">Enviar</button>
        <button id="btn-d">Deletar</button>
    </main>
</body>

</html>
